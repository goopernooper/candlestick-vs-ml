# Project settings. Values here are fixed in advance and changed only deliberately;
# log any change in DECISIONS.md.

encoding_b:
  # Symbolic encoding B: each candle's body and wicks, in units of the previous
  # day's ATR(14), are binned into 5 x 2 x 2 = 20 symbols. The gap is left out
  # to keep the alphabet small.
  #
  # Body (Close - Open), 5 levels:
  #   below -0.6   big down
  #   -0.6 to -0.1 down
  #   -0.1 to 0.1  doji-like (almost no body)
  #   0.1 to 0.6   up
  #   0.6 and up   big up
  # A value exactly on an edge goes to the level above it.
  body_edges: [-0.6, -0.1, 0.1, 0.6]
  # Each wick is "long" at 0.25 ATR or more, otherwise "short".
  wick_edge: 0.25
  # The edges were chosen in advance and checked only on the first three years,
  # roughly the first training window, so no test-period data shaped them.
  # Report: results/encoding_b_edges_check.csv (python src/encoding_b_report.py)
  checked_on: {start: "2002-01-02", end: "2004-12-31"}

labels:
  # Primary target: next-day close-to-close return and its direction.
  horizon: 1
  # Dead zone: a day whose next-day return is smaller than dead_zone_k times
  # the stock's recent volatility is too close to zero to call up or down.
  # Those days are dropped from training labels and classification metrics,
  # but kept in the backtest (trading costs still apply on them).
  dead_zone_k: 0.1
  # Recent volatility = standard deviation of the last vol_window daily
  # returns, ending on the day the prediction is made (no future data).
  vol_window: 20

splits:
  # Walk-forward validation: train on everything from train_start up to the
  # test year, test on one calendar year, then move forward a year.
  train_start: "2002-01-02"
  first_test_year: 2005
  last_test_year: 2022
  # Final holdout, used once at the end. Leave unlock_holdout false until
  # ANALYSIS_PLAN.md is frozen and tagged (week 8), then switch it on for the
  # single holdout run in week 9 and log that in DECISIONS.md.
  holdout_years: [2023, 2025]
  unlock_holdout: false
  # The purge gap between training and test equals labels.horizon (above).
  # Hyperparameters are tuned inside each training window: fit on the earlier
  # years, score on the last tuning_years years (with the same purge gap in
  # between), then refit the chosen settings on the whole training window.
  tuning_years: 1

# Random seed for everything random in the project (the random baseline now,
# model training later), so every result can be reproduced exactly.
seed: 20261016

backtest:
  # Trading rules, fixed before any results are seen (DECISIONS.md D-013).
  # A position is taken at day t's close using day t's prediction and held
  # until day t+1's close. Every stock gets an equal share of capital.
  #   long_short: +1 if the model predicts up, -1 if down
  #   long_flat:  +1 if up, 0 (in cash) if down
  # Dead-zone days are traded like any other day: costs still apply.
  strategies: [long_short, long_flat]
  # Cost per side in basis points (1 bp = 0.01%), charged on every unit of
  # position changed. Flipping long to short trades 2 units, so it costs 2 sides.
  cost_bps_per_side: 5
  cost_grid_bps: [0, 1, 2, 5, 10, 20]
  trading_days_per_year: 252
